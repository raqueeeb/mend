name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "node ${{ matrix.node }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: "Report the versions in play"
        run: |
          node --version
          npm --version

      - name: "Assert there are no dependencies"
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
            for (const field of ['dependencies', 'devDependencies', 'peerDependencies']) {
              const held = Object.keys(pkg[field] || {});
              if (held.length > 0) {
                console.error(field + ' is not empty: ' + held.join(', '));
                process.exit(1);
              }
            }
            console.log('no dependencies');
          "

      - name: "Lint"
        run: node tools/lint.js

      - name: "Test"
        run: node --test test/*.test.js

      - name: "Assert every import is relative or from the standard library"
        run: |
          if grep -rn --include='*.js' "from '[^.n]" src test tools bench bin; then
            echo "an import is neither relative nor from the standard library"
            exit 1
          fi
          echo "every import is relative or standard library"

      - name: "Check the package loads and that the versions agree"
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const mend = await import('./src/index.js');
            const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
            if (pkg.version !== mend.VERSION) {
              console.error('package.json ' + pkg.version + ' but VERSION ' + mend.VERSION);
              process.exit(1);
            }
            const before = 'one\ntwo\nthree\n';
            const after = 'one\nTWO\nthree\n';
            const patch = mend.createPatch(before, after, { oldPath: 'f', newPath: 'f' });
            if (!patch.includes('-two')) { console.error('no patch'); process.exit(1); }
            if (mend.patch(before, patch) !== after) { console.error('apply'); process.exit(1); }
            const back = mend.applyPatch(after, mend.reverse(mend.parseOne(patch)));
            if (back.text !== before) { console.error('reverse'); process.exit(1); }
            console.log('the package loads and round-trips, version ' + mend.VERSION);
          "

      - name: "Check the diff agrees with the system diff, byte for byte"
        run: |
          mkdir -p ci-tmp
          cd ci-tmp
          printf 'one\ntwo\nthree\nfour\nfive\n' > old.txt
          printf 'one\ntwo\nTHREE\nfour\nfive\n' > new.txt
          # --label keeps diff from writing a tab and a timestamp after each
          # path, which is metadata rather than part of the patch.
          diff -u --label old.txt --label new.txt old.txt new.txt > system.patch || true
          node ../bin/mend.js diff old.txt new.txt > mend.patch || true
          echo "--- system diff ---"
          cat system.patch
          echo "--- mend ---"
          cat mend.patch
          if ! diff -q system.patch mend.patch; then
            echo "mend and the system diff disagree"
            exit 1
          fi
          echo "byte-identical to the system diff"

      - name: "Check the system patch command accepts our output"
        run: |
          cd ci-tmp
          cp old.txt target.txt
          node ../bin/mend.js diff old.txt new.txt -o change.patch || true
          patch target.txt < change.patch
          if ! diff -q target.txt new.txt; then
            echo "the system patch command produced something else"
            exit 1
          fi
          echo "the system patch command applies our patch"

      - name: "Check we accept the system diff's output"
        run: |
          cd ci-tmp
          node ../bin/mend.js apply old.txt system.patch -o ours.txt
          if ! diff -q ours.txt new.txt; then
            echo "we applied the system patch to something else"
            exit 1
          fi
          echo "we apply the system diff's patch"

      - name: "Check a round trip through the system patch command, in reverse"
        run: |
          cd ci-tmp
          cp new.txt back.txt
          patch -R back.txt < change.patch
          if ! diff -q back.txt old.txt; then
            echo "reversing our patch did not restore the original"
            exit 1
          fi
          echo "the system patch command reverses our patch"

      - name: "Exercise the command line, checking the exit codes"
        run: |
          cd ci-tmp
          printf 'one\nOURS\nthree\nfour\nfive\n' > ours2.txt
          printf 'one\nTHEIRS\nthree\nfour\nfive\n' > theirs.txt

          expect() {
            want="$1"
            shift
            set +e
            "$@"
            got=$?
            set -e
            if [ "$got" -ne "$want" ]; then
              echo "expected exit $want from: $* -- got $got"
              exit 1
            fi
          }

          # Exit codes follow diff: 0 no differences, 1 differences, 2 trouble.
          expect 0 node ../bin/mend.js --version
          expect 0 node ../bin/mend.js diff old.txt old.txt
          expect 1 node ../bin/mend.js diff old.txt new.txt
          expect 2 node ../bin/mend.js diff old.txt nope.txt
          expect 2 node ../bin/mend.js diff old.txt
          expect 1 node ../bin/mend.js show change.patch
          expect 1 node ../bin/mend.js stat old.txt new.txt
          expect 0 node ../bin/mend.js stat old.txt old.txt
          expect 1 node ../bin/mend.js merge old.txt ours2.txt theirs.txt
          expect 0 node ../bin/mend.js merge old.txt ours2.txt old.txt
          expect 0 node ../bin/mend.js apply old.txt change.patch --dry-run
          expect 2 node ../bin/mend.js frobnicate old.txt new.txt
          echo "every exit code was what it should be"

      - name: "Check a file with no final newline survives a round trip"
        run: |
          cd ci-tmp
          printf 'alpha\nbeta' > nonl-old.txt
          printf 'alpha\nBETA' > nonl-new.txt
          node ../bin/mend.js diff nonl-old.txt nonl-new.txt -o nonl.patch || true
          cat nonl.patch
          if [ "$(grep -c 'No newline at end of file' nonl.patch)" -ne 2 ]; then
            echo "both sides should have been marked"
            exit 1
          fi
          cp nonl-old.txt nonl-target.txt
          patch nonl-target.txt < nonl.patch
          if ! cmp nonl-target.txt nonl-new.txt; then
            echo "the round trip changed the bytes"
            exit 1
          fi
          echo "no final newline survived, byte for byte"

      - name: "Run the benchmark, so it cannot rot"
        run: node bench/run.js
